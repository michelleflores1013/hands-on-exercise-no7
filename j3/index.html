<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript 3</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        h1 {
            font-size: 28px;
        }

        button {
            padding: 4px 8px;
            margin-right: 5px;
            cursor: pointer;
        }

        table {
            border-collapse: collapse;
            width: 570px;
            margin-top: 10px;
        }

        th,
        td {
            border: 1px solid #999;
            padding: 4px 6px;
        }

        th {
            text-align: center;
        }

        td:nth-child(1) {
            width: 60px;
            text-align: center;
        }

        td:nth-child(2) {
            width: 60px;
            text-align: center;
        }

        td:nth-child(3) {
            width: 370px;
        }

        td:nth-child(4) {
            width: 150px;
            text-align: center;
        }

        .completed {
            color: green;
            font-weight: bold;
        }

        .not-completed {
            color: red;
            font-weight: bold;
        }

        #todoTable {
            display: none;
        }
    </style>
</head>

<body>

    <h1>Javascript Web Output #3</h1>

    <button id="loadBtn">Load data from the API</button>
    <button id="clearBtn">Clear Table</button>

    <p>
        API:
        <a
            href="https://jsonplaceholder.typicode.com/todos/"
            target="_blank"
        >
            https://jsonplaceholder.typicode.com/todos/
        </a>
    </p>

    <table id="todoTable">

        <thead>
            <tr>
                <th>User ID</th>
                <th>Task ID</th>
                <th>Title</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody id="tableBody">
        </tbody>

    </table>

    <script src="script.js"></script>

</body>
</html>
